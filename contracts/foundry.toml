[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.arc]
network = "arc"

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

# Blockscout verification doesn't need an API key; pass --verifier blockscout
# --verifier-url https://explorer.<testnet.>arc.io/api/ directly on the CLI instead of an
# [etherscan] table here (forge's `${VAR:-default}` shell-style interpolation isn't supported).

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
