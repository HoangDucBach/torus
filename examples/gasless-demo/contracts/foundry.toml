[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[profile.arc]
network = "arc"

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
