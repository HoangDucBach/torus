services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torus
      POSTGRES_PASSWORD: torus
      POSTGRES_DB: torus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Testnet by default. For a mainnet instance, copy this service, swap the env_file to
  # server/.env.production, and map port 8788:8788 instead (see server/.env.production).
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
      - server/.env.development
    environment:
      DATABASE_URL: postgres://torus:torus@postgres:5432/torus
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
