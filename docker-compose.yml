services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torus
      POSTGRES_PASSWORD: torus
      POSTGRES_DB: torus
    ports:
      # Loopback-only — the server containers reach it over the internal docker network; nothing
      # outside the host needs to.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torus"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-testnet:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
      - server/.env.development
    environment:
      DATABASE_URL: postgres://torus:torus@postgres:5432/torus
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  server-mainnet:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
      - server/.env.production
    environment:
      DATABASE_URL: postgres://torus:torus@postgres:5432/torus
    ports:
      - "8788:8788"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
